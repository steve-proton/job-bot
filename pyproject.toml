[project]
name = "jobbot"
version = "0.1.0"
description = "An agent-loop job finder and application tracker."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobbot = "jobbot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
