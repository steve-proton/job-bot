# Your job-search criteria. Edit freely — this drives the agent's fit scoring.
# The agent reads this (via the system prompt) and scores each job 0-100.

titles:            # role titles / keywords you're targeting
  - Engineering Manager
  - Senior Engineering Manager
  - Director of Engineering
  - Software Engineering Manager

keywords:          # tech / domain signals that raise fit
  - identity
  - authentication
  - IAM
  - healthcare
  - health tech
  - digital health

seniority: manager   # junior | mid | senior | staff | manager | director

locations:         # acceptable locations
  - Remote
  - Boston, MA
  - Greater Boston

remote: preferred  # required | preferred | acceptable | no

min_salary_usd: null   # not filtering on comp for now

must_haves:        # a job missing any of these should score low
  - People-management role (has direct reports)
  - Remote-friendly, or based in the Boston metro area

nice_to_haves:     # raise the score but not required
  - Identity / authentication / IAM domain
  - Healthcare / health-tech domain
  - Equity

dealbreakers:      # any of these present -> score very low
  - Individual-contributor-only (no direct reports)
  - Requires relocation outside Boston with no remote option
