# ATS job boards to poll — identity + healthcare domains.
# Every board below was verified live (returns jobs) on 2026-07-23.
#
# To add a company: find its careers URL and add the slug under the right ats:
#   greenhouse: boards.greenhouse.io/<token>   -> {ats: greenhouse, token: <token>}
#   lever:      jobs.lever.co/<company>         -> {ats: lever, company: <company>}
#   ashby:      jobs.ashbyhq.com/<board>        -> {ats: ashby, board: <board>}

